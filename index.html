<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="three.js 互動場景：富士山下的 7-ELEVEN 河口湖站東店。自由探索商店街，即時切換時間與天氣。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%97%BB%3C/text%3E%3C/svg%3E">
<title>富士山下的 7-ELEVEN · 自由探索</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<div id="loading"><div class="box">🗻 正在搭建富士山下的街道…</div></div>

<div id="ui">
  <div id="panel">
    <div id="panelHead">
      <h1>🗻 富士山下的 7-ELEVEN</h1>
      <button id="collapseBtn" title="收起 / 展開">—</button>
    </div>
    <div id="panelBody">
      <div class="sec">
        <div class="secTitle"><span>時間</span><span id="clock">17:48</span></div>
        <input id="timeSlider" type="range" min="0" max="24" step="0.1" value="17.8">
        <div class="btnRow">
          <button class="chip timePreset" data-t="6.5">🌅 清晨</button>
          <button class="chip timePreset" data-t="12">☀️ 正午</button>
          <button class="chip timePreset" data-t="17.8">🌆 黃昏</button>
          <button class="chip timePreset" data-t="21.5">🌙 夜晚</button>
        </div>
        <label class="chk"><input type="checkbox" id="autoTime"> 時間流動（自動推進）</label>
      </div>

      <div class="sec">
        <div class="secTitle"><span>天氣</span></div>
        <div class="btnRow" id="weatherRow">
          <button class="chip wx active" data-w="clear">☀️ 晴天</button>
          <button class="chip wx" data-w="sakura">🌸 櫻花</button>
          <button class="chip wx" data-w="cloudy">☁️ 多雲</button>
          <button class="chip wx" data-w="rain">🌧 下雨</button>
          <button class="chip wx" data-w="storm">⛈ 雷暴</button>
          <button class="chip wx" data-w="snow">❄️ 下雪</button>
          <button class="chip wx" data-w="fog">🌫 起霧</button>
        </div>
      </div>

      <div class="sec">
        <div class="btnRow">
          <button class="chip" id="classicBtn">📸 經典機位</button>
          <button class="chip" id="resetBtn">🚩 回到起點</button>
        </div>
      </div>

      <div class="help">
        <b>WASD / 方向鍵</b> 移動 · <b>Shift</b> 奔跑 · <b>Space</b> 跳躍<br>
        按住滑鼠拖曳 轉視角 · 滾輪 縮放
      </div>
    </div>
  </div>
</div>

<script src="libs/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/world.js"></script>
<script src="js/sky.js"></script>
<script src="js/character.js"></script>
<script src="js/environment.js"></script>
<script src="js/main.js"></script>
</body>
</html>
